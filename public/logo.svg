<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="40%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#C99200"/>
    </radialGradient>
    <radialGradient id="sat" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="50%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#050505"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#F5C518" stroke-opacity="0.4" stroke-width="4" filter="url(#edge)"/>
  <circle cx="256" cy="256" r="190" fill="#F5C518" opacity="0.07"/>
  <ellipse cx="256" cy="256" rx="172" ry="74" transform="rotate(-32 256 256)" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.95"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#ring)" stroke-width="9" opacity="0.92"/>
  <ellipse cx="256" cy="256" rx="160" ry="52" transform="rotate(48 256 256)" fill="none" stroke="#F5C518" stroke-width="4" opacity="0.35"/>
  <circle cx="256" cy="256" r="62" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="238" cy="236" r="20" fill="#FFF6C2" opacity="0.5"/>
  <circle cx="402" cy="162" r="15" fill="url(#sat)" filter="url(#glow)"/>
  <circle cx="108" cy="352" r="13" fill="url(#sat)" filter="url(#glow)"/>
</svg>
